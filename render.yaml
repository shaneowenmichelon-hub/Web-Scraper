services:
  - type: web
    name: promoter-tracker
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # CRITICAL: pin Node so better-sqlite3 uses a prebuilt binary.
      # Node 23+ has no prebuilt and will fail to compile from source.
      - key: NODE_VERSION
        value: "22"
      - key: EXA_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    # Persistent disk — SQLite DB survives deploys. Requires a paid plan
    # (Render Pro is fine). The mountPath matches src/db.js: DB_PATH =
    # <repo>/data/scraper.db, which Render places at
    # /opt/render/project/src/data on this service.
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
